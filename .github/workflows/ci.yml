name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck yamllint
      - name: secret gate
        run: scripts/check-secrets.sh
      - name: shellcheck
        run: |
          shellcheck -x installer/install.sh installer/make-usb.sh installer/autoinstall/disk-guard.sh couch/bin/kiosk \
            installer/files/kernel/zz-couch-xone-check \
            scripts/*.sh tests/rehearsal/*.sh tests/fixtures/bin/* tests/fixtures/fake-moonlight.AppImage
      - name: yamllint (rendered autoinstall + workflows)
        run: |
          COUCH_ADMIN_HASH='$6$ci$ci' installer/make-usb.sh --render-only /tmp/seed --disk only
          yamllint -c .yamllint.yml /tmp/seed/user-data .github/workflows/ci.yml

  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - run: bats tests/bats

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  rehearsal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, systemd]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh rehearsal in ubuntu:24.04 (${{ matrix.mode }})
        run: tests/rehearsal/rehearse.sh ${{ matrix.mode }}

  workstation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pester 5.6.1
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.6.1 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: PS 5.1 lint (ASCII, no BOM, no PS7-only syntax)
        shell: pwsh
        run: |
          ./workstation/tests/Lint-PS51.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./workstation/tests/Lint-PS51.ps1 -Path ./workstation/tests/lint-fixtures | Out-Null
          if ($LASTEXITCODE -ne 1) { Write-Error 'lint did not catch the PS7-only fixture'; exit 1 }
          exit 0
      - name: Pester on fixtures (dry run writes nothing)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.6.1
          $c = New-PesterConfiguration
          $c.Run.Path = 'workstation/tests'
          $c.Run.Exit = $true
          $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
